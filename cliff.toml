# Release notes from Conventional Commits (https://www.conventionalcommits.org), see https://git-cliff.org

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    # commits from the original EnableYoutubePCVR project
    { field = "author.name", pattern = "feedthedogs", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 5 -->Build" },
    { message = "^(style|chore|test)", skip = true },
    # commits from before the switch to Conventional Commits
    { message = ".*", group = "<!-- 6 -->Other" },
]
tag_pattern = "v[0-9].*"
